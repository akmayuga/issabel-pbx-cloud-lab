services:
  prometheus:
    image: prom/prometheus:v2.53.1
    container_name: issabel-prometheus
    network_mode: host
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.listen-address=0.0.0.0:9090
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.1.4
    container_name: issabel-grafana
    network_mode: host
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-change-me-now}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./provisioning:/etc/grafana/provisioning:ro
    restart: unless-stopped

  node_exporter:
    image: prom/node-exporter:v1.8.2
    container_name: issabel-node-exporter
    network_mode: host
    pid: host
    volumes:
      - /:/host:ro,rslave
      - /var/lib/node_exporter/textfile_collector:/var/lib/node_exporter/textfile_collector:ro
    command:
      - --path.rootfs=/host
      - --collector.textfile.directory=/var/lib/node_exporter/textfile_collector
      - --web.listen-address=0.0.0.0:9100
    restart: unless-stopped

volumes:
  grafana_data:
  prometheus_data:
